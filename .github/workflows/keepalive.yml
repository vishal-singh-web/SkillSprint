name: Keep services warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: curl --fail --silent --show-error --max-time 30 "$RENDER_HEALTH_URL"

      - name: Ping Supabase Auth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: curl --fail --silent --show-error --max-time 30 "$SUPABASE_URL/auth/v1/health"

      - name: Touch Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          curl --fail --silent --show-error --max-time 30
          -H "apikey: $SUPABASE_ANON_KEY"
          "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1"
